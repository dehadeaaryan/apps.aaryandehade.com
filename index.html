<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaryan's Apps</title>

    <meta property="og:title" content="Aaryan's Apps" />
    <meta property="og:description" content="Live side projects and experiments." />
    <meta property="og:url" content="https://apps.aaryandehade.com" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="aaryandehade-logo.png">

    <style>
        /* Base Variables based on Pollish styling */
        :root {
            --canvas: #09090b;
            /* Very dark, almost black background */
            --ink: #ffffff;
            --muted: #a1a1aa;
            --accent: #f97316;
            /* Orange accent */
            --line: rgba(255, 255, 255, 0.1);
            --surface: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Ambient Background Effects --- */
        .background-layer {
            position: fixed;
            inset: 0;
            z-index: -10;
            pointer-events: none;
            overflow: hidden;
        }

        /* Blobs */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            animation: float 20s ease-in-out infinite alternate;
        }

        .blob-one {
            top: 10%;
            left: 10%;
            width: 50vw;
            height: 50vw;
            background-color: #f97316;
            /* Orange */
        }

        .blob-two {
            top: 40%;
            right: -10%;
            width: 40vw;
            height: 40vw;
            background-color: #3b82f6;
            /* Blue */
            animation-delay: -5s;
        }

        /* SVG Noise/Grain */
        .grain-layer {
            position: absolute;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(5%, 10%) scale(1.1);
            }
        }

        /* --- Pollish Floating Pill Header --- */
        .site-header {
            position: sticky;
            top: 12px;
            z-index: 50;
            margin: 12px auto 0;
            width: 91.666%;
            /* w-11/12 */
            max-width: 80rem;
            /* max-w-7xl */
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 9999px;
            /* rounded-full */
            border: 1px solid var(--line);
            background-color: var(--surface);
            padding: 8px 12px 8px 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
        }

        /* Logo & Brand */
        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--ink);
            font-size: 1.125rem;
            /* text-lg */
            font-weight: 900;
            /* font-black */
            letter-spacing: -0.025em;
            /* tracking-tight */
            transition: color 0.2s ease;
        }

        .brand-link:hover {
            color: var(--accent);
        }

        .brand-link img {
            height: 36px;
            width: 36px;
            border-radius: 8px;
            /* rounded-lg */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .brand-link:hover img {
            transform: rotate(-3deg) scale(1.05);
            /* Pollish hover effect */
        }

        .accent-dot {
            color: var(--accent);
        }

        /* Navigation */
        .site-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .button-secondary {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 4px 8px;
            border-radius: 9999px;
            /* rounded-full to match Pollish buttons */
            font-size: 0.75rem;
            /* text-xs */
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .button-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent);
        }

        /* --- Main Content --- */
        .main-container {
            width: 80%;
            max-width: 100%;
            margin: 0 auto;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .app-list {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            gap: 24px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .app-list {
                grid-template-columns: repeat(2, 1fr);
                /* 2 columns on screens 768px and wider */
            }
        }

        /* --- Glassy App Cards --- */
        .app-card {
            display: flex;
            flex-direction: column;
            border-radius: 1.25rem;
            width: 100%;
            max-width: 420px;
            /* Slightly rounder to match the pill aesthetic */
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            text-decoration: none;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .app-card:hover,
        .app-card:active {
            border-color: rgba(249, 115, 22, 0.4);
            background-color: rgba(255, 255, 255, 0.06);
            transform: translateY(-3px) scale(0.99);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.4);
        }

        .preview-image {
            width: 100%;
            height: 240px;
            object-fit: contain;
            background-color: #121214;
            border-bottom: 1px solid var(--line);
            display: block;
        }

        .preview-text {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .app-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--ink);
            margin: 0;
        }

        .app-url {
            font-size: 0.6875rem;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin: 0;
        }

        .arrow-icon {
            color: var(--muted);
            width: 18px;
            height: 18px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .app-card:hover .arrow-icon,
        .app-card:active .arrow-icon {
            color: var(--accent);
            transform: translateX(4px);
        }

        /* --- Footer --- */
        .site-footer {
            width: 91.666%;
            max-width: 80rem;
            margin: auto auto 0;
            padding: 24px 0;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <!-- Ambient background layer -->
    <div class="background-layer" aria-hidden="true">
        <div class="ambient-blob blob-one"></div>
        <div class="ambient-blob blob-two"></div>
        <div class="grain-layer"></div>
    </div>

    <!-- Pollish style floating header -->
    <header class="site-header">
        <a class="brand-link" href="https://aaryandehade.com" aria-label="Home">
            <img src="apple-touch-icon.png" alt="Logo" />
            <span>Apps<span class="accent-dot">.</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a class="button-secondary" href="https://github.com/dehadeaaryan">
                GitHub
                <span aria-hidden="true" style="font-family: system-ui;">↗</span>
            </a>
            <a class="button-secondary" href="https://aaryandehade.com">
                Main Site
                <span aria-hidden="true" style="font-family: system-ui;">↗</span>
            </a>
        </nav>
    </header>

    <main class="main-container">
        <div class="eyebrow">
            <span class="status-dot"></span>
            Live Deployments
        </div>

        <div class="app-list">
            <!-- DropThatClass -->
            <a href="https://dropthatclass.com" class="app-card">
                <img src="dropthatclass-preview.png" alt="DropThatClass" class="preview-image">
                <div class="preview-text">
                    <div class="app-info">
                        <p class="app-title">DropThatClass</p>
                        <p class="app-url">dropthatclass.com</p>
                    </div>
                    <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </div>
            </a>

            <!-- Shalendar -->
            <a href="https://shalendar.aaryandehade.com" class="app-card">
                <img src="shalendar-preview.png" alt="Shalendar" class="preview-image">
                <div class="preview-text">
                    <div class="app-info">
                        <p class="app-title">Shalendar</p>
                        <p class="app-url">shalendar.aaryandehade.com</p>
                    </div>
                    <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </div>
            </a>

            <!-- Pollish -->
            <a href="https://pollish.aaryandehade.com" class="app-card">
                <img src="pollish-preview.png" alt="Pollish" class="preview-image">
                <div class="preview-text">
                    <div class="app-info">
                        <p class="app-title">Pollish</p>
                        <p class="app-url">pollish.aaryandehade.com</p>
                    </div>
                    <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </div>
            </a>

            <!-- Cooldown Room -->
            <a href="https://cooldownroom.aaryandehade.com" class="app-card">
                <img src="cooldownroom-preview.png" alt="Cooldown Room" class="preview-image">
                <div class="preview-text">
                    <div class="app-info">
                        <p class="app-title">Cooldown Room</p>
                        <p class="app-url">cooldownroom.aaryandehade.com</p>
                    </div>
                    <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="m12 5 7 7-7 7" />
                    </svg>
                </div>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <span>Aaryan Dehade · © 2026</span>
    </footer>

</body>

</html>
